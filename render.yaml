services:
  - type: web
    name: eventpark-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -e .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
      - key: RATE_LIMIT
        value: 200/minute
      - key: HTTPS_REDIRECT
        value: "false"
      - key: PYTHONUNBUFFERED
        value: "1"
