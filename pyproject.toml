[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eventpark"
version = "0.1.0"
description = "EventPark — peer-to-peer event parking marketplace"
requires-python = ">=3.11,<4.0"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "pydantic>=2.5",
    "pydantic[email]>=2.5",
    "email-validator>=2.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt<4.1",
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.9",
    "slowapi>=0.1.9",
    "jinja2>=3.1",
    "httpx>=0.26",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "pyjwt>=2.8",
    "playwright>=1.44",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "deploy: live-deploy smoke tests; require BASE_URL and WEB_URL env vars",
]
